version: 1.0

service:
  name: alert-api
  build:
    method: "Dockerfile"
    dockerfile: "Dockerfile"
  runtime:
    port: 8003
    startCommand: ""
  healthCheck:
    path: /healthz
    interval: 10
    timeout: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
  environment:
    variables:
      BUNDLE_S3_BUCKET: "demo-turbine-ml-models"
      BUNDLE_S3_KEY: "alert/model_bundle.pkl"
      BUNDLE_PATH: "/app/models/model_bundle.pkl"
      AWS_REGION: "eu-north-1"
      API_KEY: "6c7a0f19-8e2b-4e5b-b278-2e36bb7f8d9d"
